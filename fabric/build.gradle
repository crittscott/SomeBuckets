plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

rootProject.configureGameTests(project)

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        somebuckets_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gameTestServer {
            server()
            name 'Game Test Server'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get().asFile}/gametest-report.xml"
            source sourceSets.gametest
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url = 'https://maven.nucleoid.xyz/' }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Optional: claim mods that implement Common Protection API ship it; checks run only when present.
    compileOnly("eu.pb4:common-protection-api:$rootProject.common_protection_api_version") {
        transitive = false
    }
    runtimeOnly("eu.pb4:common-protection-api:$rootProject.common_protection_api_version") {
        transitive = false
    }

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

// Expands placeholders in the Fabric manifest and Mixin config.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = rootProject.sharedModProperties + [
            fabric_loader_version: fabric_loader_version,
            fabric_api_version: fabric_api_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'somebuckets.fabric.mixins.json']) {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}

jar {
    archiveClassifier = 'dev'
}

tasks.named('assemble') {
    dependsOn shadowJar
}

loom.injectAccessWidener(tasks.named('shadowJar'))

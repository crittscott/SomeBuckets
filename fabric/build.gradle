plugins {
    id 'fabric-loom'
    id 'multiloader-loader'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "dev.architectury:architectury-fabric:${architectury_api_version}"

    // common's source uses javax.annotation.Nullable. Only common's source (not its dependency
    // jars) is pulled into this module by multiloader-loader.gradle, so this must be redeclared
    // here even though common itself already depends on it. Forge doesn't need this line: it
    // gets javax.annotation.Nullable transitively through ModDevGradle's own dependency chain,
    // which Fabric Loom's does not provide. See multi-loader-transition.md, "Optional integrations".
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // Optional FTB Chunks integration. The Fabric artifact exposes the same claim API used by
    // the Forge adapter; runtime registration remains guarded by FabricLoader.isModLoaded.
    modCompileOnly "dev.ftb.mods:ftb-chunks-fabric:${ftb_chunks_version}"
}

// Expands ${...} placeholders in fabric.mod.json (this module's own resource) and pack.mcmeta
// (common's resource, merged into this module's output by multiloader-loader.gradle's
// processResources wiring). Mirrors forge/build.gradle's equivalent block; see
// multi-loader-transition.md, "Loader metadata".
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            fabric_loader_version: fabric_loader_version,
            architectury_api_version: architectury_api_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

loom {
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('run')
        }
    }
}

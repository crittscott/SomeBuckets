plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets {
    main {
        // Optional FTB Chunks protection adapter. Compiled into Fabric and NeoForge only; Forge
        // omits this srcDir because there is no FTB Chunks build for Forge on 1.21.1. The adapter
        // registers itself at runtime only when FTB Chunks is present.
        java.srcDir rootProject.file('common/src/compat/java')
    }
    gametest {
        java.srcDir rootProject.file('common/src/gametest/java')
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        // Fabric's dev run does not carry :common's main output onto the gametest run classpath
        // through sourceSets.main the way Forge and NeoForge do, so add it explicitly. Without this
        // runGameTestServer cannot load common classes such as platform.BucketOperations.
        compileClasspath += project(':common').sourceSets.main.output
        runtimeClasspath += project(':common').sourceSets.main.output
    }
}

loom {
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        somebuckets_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gameTestServer {
            server()
            name 'Game Test Server'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get().asFile}/gametest-report.xml"
            source sourceSets.gametest
        }
    }
}

// The integrated server reuses run/world between launches; clear it so entities placed or captured
// by one GameTest run cannot leak into the next.
def gameTestWorldDirectory = layout.projectDirectory.dir('run/world')
tasks.named('runGameTestServer').configure {
    doFirst {
        project.delete(gameTestWorldDirectory)
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modCompileOnly "dev.ftb.mods:ftb-chunks-fabric:${ftb_chunks_version}"
}

rootProject.configureGameTestStructures(project)

// Expands ${...} placeholders in fabric.mod.json (this module's own resource).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = rootProject.sharedModProperties + [
            fabric_loader_version: fabric_loader_version,
            fabric_api_version: fabric_api_version,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

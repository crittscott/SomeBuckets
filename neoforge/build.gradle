plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases/' }
}

rootProject.configureGameTests(project)
sourceSets.main.resources.srcDir 'src/generated/resources'

def commonResources = project(':common').tasks.named('processResources', ProcessResources)

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        somebuckets_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        data {
            clientData()
            name 'Data'
            source sourceSets.main
            programArgs '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', commonResources.get().destinationDir.absolutePath
        }

        gameTestServer {
            server()
            environment 'gametestserver'
            forgeTemplate 'gameTestServer'
            name 'Game Test Server'
            property 'neoforge.enableGameTest', 'true'
            source sourceSets.gametest
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    // Loom loads common with the platform's main mod. A separate runtime JAR would split packages.
    compileClasspath.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_compile_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

// NeoForge also needs pack metadata at its own development resource root.
tasks.named('processResources', ProcessResources).configure {
    from project(':common').file('src/main/resources/pack.mcmeta')
    var replaceProperties = rootProject.sharedModProperties + [
            minecraft_version_range: minecraft_version_range,
            neoforge_version_range: neoforge_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
    ] + rootProject.packFormatProperties
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// Expands the GameTest manifest and data pack metadata.
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            mod_license                  : mod_license,
            neoforge_version_range       : neoforge_version_range,
            neoforge_loader_version_range: neoforge_loader_version_range,
            minecraft_version_range      : minecraft_version_range,
    ] + rootProject.packFormatProperties
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
    filesMatching('pack.mcmeta') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

jar {
    archiveClassifier = 'dev'
}

tasks.named('assemble') {
    dependsOn shadowJar
}

loom.getNeoForge().convertAccessWideners(tasks.named('shadowJar'), 'somebuckets.accesswidener')

// Loom loads common's class and resource directories as part of the main mod.
tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer', 'runData'] }.configureEach {
    dependsOn project(':common').tasks.named('classes')
}

rootProject.configureNativeDataGeneration(project)

# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 0.8.3
maven_group = com.github.crittscott.somebuckets
archives_name = somebuckets
enabled_platforms = fabric,forge,neoforge

# Must match SomeBuckets.MODID and every loader's metadata.
mod_id = somebuckets
# The human-readable display name for the mod.
mod_name = Some Buckets
# SPDX license identifier used by every loader's metadata.
mod_license = GPL-3.0
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors = crittscott
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description = Get you some buckets!
# Stable project homepage; source and issue URLs are derived from this.
mod_homepage = https://github.com/crittscott/SomeBuckets

# Build tools
# Java toolchain and the minimum Java version declared in Fabric metadata.
java_version = 21
# Plugin versions are resolved in settings.gradle.
loom_version = 1.17.493
architectury_plugin_version = 3.5.170
shadow_version = 9.4.3
jsr305_version = 3.0.2

# Minecraft properties
minecraft_version = 1.21.1
# NeoForge runtime compatibility declarations vary by Minecraft release.
neoforge_version_range = [21.1.1,22)
# NeoForge's JavaFML loader has its own version independent of the NeoForge release number.
neoforge_loader_version_range = [1,)
# Mojang official mappings layered with Parchment. See https://parchmentmc.org/docs/getting-started
parchment_minecraft = 1.21.1
parchment_version = 2024.11.17

# Dependencies
fabric_loader_version = 0.20.1
fabric_api_version = 0.116.17+1.21.1
# Forge compile and development baseline. The runtime range ends at the next major.
forge_version = 52.1.0
neoforge_compile_version = 21.1.1

# Optional protection dependencies for this Minecraft version.
ftb_chunks_version = 2101.1.21
ftb_chunks_version_range = [2101,2102)

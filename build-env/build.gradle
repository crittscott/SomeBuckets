plugins {
    id 'dev.architectury.loom' version '1.17.493' apply false
    id 'architectury-plugin' version '3.5.170'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
    minecraft = project.minecraft_version
}

// Creates a loader's `gametest` source set over the shared scenarios and resources, and registers
// its GameTest Javadoc task.
ext.configureGameTests = { Project loaderProject ->
    def main = loaderProject.sourceSets.main
    def gametest = loaderProject.sourceSets.create('gametest')
    gametest.java.srcDir rootProject.file('common/src/gametest/java')
    gametest.resources.srcDir rootProject.file('common/src/gametest/resources')
    gametest.compileClasspath += main.compileClasspath + main.output
    gametest.runtimeClasspath += main.runtimeClasspath + main.output

    def structureSource = rootProject.layout.projectDirectory.file(
            'common/src/gametest/fixtures/empty_9x6x9.nbt.b64')
    def structureOutput = loaderProject.layout.buildDirectory.file(
            'generated/gametest/resources/data/somebuckets/structures/empty_9x6x9.nbt')

    loaderProject.tasks.register('generateGameTestStructures') {
        inputs.file(structureSource)
        outputs.file(structureOutput)

        doLast {
            def output = structureOutput.get().asFile
            output.parentFile.mkdirs()
            output.bytes = Base64.getMimeDecoder().decode(structureSource.asFile.text)
        }
    }

    gametest.resources {
        srcDir loaderProject.layout.buildDirectory.dir('generated/gametest/resources')
    }
    loaderProject.tasks.named('processGametestResources').configure {
        dependsOn loaderProject.tasks.named('generateGameTestStructures')
    }

    loaderProject.tasks.register('gametestJavadoc', Javadoc) {
        group = 'documentation'
        description = "Generates ${loaderProject.name} GameTest Javadoc."

        source gametest.allJava
        classpath = gametest.compileClasspath
        destinationDir = loaderProject.layout.buildDirectory.dir('docs/gametestJavadoc').get().asFile

        // Shared scenarios and helpers are deliberately package-private; they contain the
        // authoritative manual and automation-only procedures linked by the public test wrappers.
        options.addBooleanOption('package', true)
    }
}

// Native data runs need main classes and processed metadata before they can generate loot data.
// Archive tasks replace the launch baseline with the freshly generated resources, avoiding a
// processResources -> runData -> classes -> processResources dependency cycle.
ext.configureNativeDataGeneration = { Project loaderProject ->
    def generated = loaderProject.layout.projectDirectory.dir('src/generated/resources')
    def dataRun = loaderProject.tasks.named('runData')
    def processed = loaderProject.tasks.named('processResources', ProcessResources)

    // Loom advertises every declared dev mod to the loader, including the GameTest support mod.
    // Its class and metadata outputs must exist even when the selected run only generates data.
    def launcher = loaderProject.sourceSets.create('datagenLauncher')
    launcher.java.srcDir rootProject.file('common/src/datagenLauncher/java')

    // The runtime launch chain can return while non-daemon workers keep the JVM alive.
    // This isolated launcher exits after that chain returns and is absent from mod archives.
    dataRun.configure {
        dependsOn loaderProject.tasks.named('gametestClasses')
        dependsOn loaderProject.tasks.named(launcher.classesTaskName)
        classpath += launcher.output

        doFirst {
            systemProperty 'somebuckets.datagen.mainClass', mainClass.get()
            mainClass.set('com.github.crittscott.somebuckets.datagen.DataRunLauncher')
        }
    }

    loaderProject.sourceSets.main.resources.exclude '.cache/**'
    ['jar', 'shadowJar'].each { taskName ->
        loaderProject.tasks.named(taskName).configure {
            dependsOn dataRun
            from(generated) { exclude '.cache/**' }
            eachFile { details ->
                if (details.path.matches('data/[^/]+/loot_modifiers/.*') &&
                        details.file.toPath().startsWith(processed.get().destinationDir.toPath())) {
                    details.exclude()
                }
            }
        }
    }
    loaderProject.tasks.named('sourcesJar').configure {
        dependsOn dataRun
    }
}

// Placeholder values shared by every loader's `${...}` resource expansion. Each loader adds its own
// loader-specific version ranges on top of this.
ext.sharedModProperties = [
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_license      : mod_license,
        mod_version      : mod_version,
        mod_authors      : mod_authors,
        mod_description  : mod_description,
        mod_homepage     : mod_homepage,
        mod_sources      : "${mod_homepage}/tree/${minecraft_version}",
        mod_issues       : "${mod_homepage}/issues",
        minecraft_version: minecraft_version,
]

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'

    base {
        // Give every loader jar a platform and Minecraft-version suffix.
        archivesName = "$rootProject.archives_name-$project.name-$rootProject.minecraft_version"
    }

    repositories {
        maven { url = 'https://maven.parchmentmc.org' }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
        }

        // common and every loader's source uses javax.annotation.Nullable. Neither Loom nor the
        // loader dependencies reliably provide it, so declare it for all modules here.
        compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        withSourcesJar()

        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
}

def documentedGameTestProjects = enabled_platforms.split(',').collect { project(":$it") }
def documentedProjects = [project(':common')] + documentedGameTestProjects

tasks.register('generateDocs', Sync) {
    group = 'documentation'
    description = 'Generates the committed production and GameTest Javadoc under docs/javadoc.'

    into layout.projectDirectory.dir('docs/javadoc')

    documentedProjects.each { documentedProject ->
        def moduleJavadoc = documentedProject.tasks.named('javadoc', Javadoc)
        dependsOn moduleJavadoc

        from(moduleJavadoc.map { it.destinationDir }) {
            into documentedProject.name
        }
    }

    documentedGameTestProjects.each { documentedProject ->
        def gametestJavadoc = documentedProject.tasks.named('gametestJavadoc', Javadoc)
        dependsOn gametestJavadoc

        from(gametestJavadoc.map { it.destinationDir }) {
            into "${documentedProject.name}-gametest"
        }
    }
}

// Copies every loader's already-built production jar into the jars directory shared by all version
// checkouts, for installing into a local launcher. It builds nothing, skips jars that have not been
// built, and leaves other versions' jars there alone.
tasks.register('collectJars', Copy) {
    group = 'build'
    description = "Copies the loaders' already-built production jars into ../jars."

    into rootProject.file('../jars')

    enabled_platforms.split(',').each { platform ->
        def loader = project(":$platform")
        from(loader.layout.buildDirectory.dir('libs')) {
            include "${loader.base.archivesName.get()}-${loader.version}.jar"
        }
    }
}

plugins {
    id 'dev.architectury.loom' version '1.17.493' apply false
    id 'architectury-plugin' version '3.5.170'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
    minecraft = project.minecraft_version
}

// Creates a loader's `gametest` source set over the shared scenarios, decodes the shared GameTest
// structure into its resources, and registers its GameTest Javadoc task.
ext.configureGameTests = { Project loaderProject ->
    def main = loaderProject.sourceSets.main
    def gametest = loaderProject.sourceSets.create('gametest')
    gametest.java.srcDir rootProject.file('common/src/gametest/java')
    gametest.resources.srcDir loaderProject.layout.buildDirectory.dir('generated/gametest/resources')
    gametest.compileClasspath += main.compileClasspath + main.output
    gametest.runtimeClasspath += main.runtimeClasspath + main.output

    def structureSource = rootProject.layout.projectDirectory.file(
            'common/src/gametest/fixtures/empty_9x6x9.nbt.b64')
    def structureOutput = loaderProject.layout.buildDirectory.file(
            'generated/gametest/resources/data/somebuckets/structure/empty_9x6x9.nbt')

    loaderProject.tasks.register('generateGameTestStructures') {
        inputs.file(structureSource)
        outputs.file(structureOutput)

        doLast {
            def output = structureOutput.get().asFile
            output.parentFile.mkdirs()
            output.bytes = Base64.getMimeDecoder().decode(structureSource.asFile.text)
        }
    }

    loaderProject.tasks.named('processGametestResources').configure {
        dependsOn loaderProject.tasks.named('generateGameTestStructures')
    }

    loaderProject.tasks.register('gametestJavadoc', Javadoc) {
        group = 'documentation'
        description = "Generates ${loaderProject.name} GameTest Javadoc."

        source gametest.allJava
        classpath = gametest.compileClasspath
        destinationDir = loaderProject.layout.buildDirectory.dir('docs/gametestJavadoc').get().asFile

        // Shared scenarios and helpers are deliberately package-private; they contain the
        // authoritative manual and automation-only procedures linked by the public test wrappers.
        options.addBooleanOption('package', true)
    }
}

// The common manifest is the only bucket-loot policy. Each loader's data-driven modifier resources
// are regenerated on every resource-processing run so they cannot drift from Fabric's runtime rules.
ext.configureBucketLootModifiers = { Project loaderProject, String namespace ->
    def manifest = rootProject.layout.projectDirectory.file(
            'common/src/main/resources/somebuckets/bucket_loot.json')
    def outputDir = loaderProject.layout.buildDirectory.dir('generated/loot/resources')

    loaderProject.tasks.register('generateBucketLootModifiers') {
        inputs.file(manifest)
        inputs.property('namespace', namespace)
        outputs.dir(outputDir)

        doLast {
            def rewards = new groovy.json.JsonSlurper().parse(manifest.asFile).rewards
            def outputRoot = outputDir.get().asFile
            loaderProject.delete(outputRoot)

            def writeJson = { String relativePath, Object value ->
                def file = new File(outputRoot, relativePath)
                file.parentFile.mkdirs()
                file.text = groovy.json.JsonOutput.prettyPrint(
                        groovy.json.JsonOutput.toJson(value)) + System.lineSeparator()
            }

            rewards.each { reward ->
                def modifier = [
                        type      : 'somebuckets:add_bucket',
                        conditions: [
                                [condition: 'minecraft:any_of', terms: reward.targets.collect { target ->
                                    [condition: "${namespace}:loot_table_id".toString(), loot_table_id: target]
                                }],
                                [condition: 'minecraft:random_chance', chance: reward.chance]
                        ],
                        item      : reward.item
                ]
                if (reward.powder_units != null) modifier.powder_units = reward.powder_units
                writeJson("data/somebuckets/loot_modifiers/${reward.id}.json", modifier)
            }

            writeJson("data/${namespace}/loot_modifiers/global_loot_modifiers.json", [
                    replace: false,
                    entries: rewards.collect { reward -> "somebuckets:${reward.id}".toString() }
            ])
        }
    }

    loaderProject.sourceSets.main.resources { srcDir outputDir }
    loaderProject.tasks.named('processResources').configure {
        dependsOn loaderProject.tasks.named('generateBucketLootModifiers')
    }
    loaderProject.tasks.named('sourcesJar').configure {
        dependsOn loaderProject.tasks.named('generateBucketLootModifiers')
    }
}

// Placeholder values shared by every loader's `${...}` resource expansion. Each loader adds its own
// loader-specific version ranges on top of this.
ext.sharedModProperties = [
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_license      : mod_license,
        mod_version      : mod_version,
        mod_authors      : mod_authors,
        mod_description  : mod_description,
        minecraft_version: minecraft_version,
]

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name-$rootProject.minecraft_version"
    }

    repositories {
        maven { url = 'https://maven.parchmentmc.org' }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
        }

        // common and every loader's source uses javax.annotation.Nullable. Neither Loom nor the
        // loader dependencies reliably provide it, so declare it for all modules here.
        compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
}

def documentedGameTestProjects = enabled_platforms.split(',').collect { project(":$it") }
def documentedProjects = [project(':common')] + documentedGameTestProjects

tasks.register('generateDocs', Sync) {
    group = 'documentation'
    description = 'Generates the committed production and GameTest Javadoc under docs/javadoc.'

    into layout.projectDirectory.dir('docs/javadoc')

    documentedProjects.each { documentedProject ->
        def moduleJavadoc = documentedProject.tasks.named('javadoc', Javadoc)
        dependsOn moduleJavadoc

        from(moduleJavadoc.map { it.destinationDir }) {
            into documentedProject.name
        }
    }

    documentedGameTestProjects.each { documentedProject ->
        def gametestJavadoc = documentedProject.tasks.named('gametestJavadoc', Javadoc)
        dependsOn gametestJavadoc

        from(gametestJavadoc.map { it.destinationDir }) {
            into "${documentedProject.name}-gametest"
        }
    }
}

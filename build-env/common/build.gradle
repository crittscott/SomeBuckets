architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file('src/main/resources/somebuckets.accesswidener')
}

dependencies {
    // Shared client classes use Fabric's environment annotations.
    compileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = rootProject.packFormatProperties
    inputs.properties replaceProperties

    filesMatching('pack.mcmeta') {
        expand replaceProperties
    }
}


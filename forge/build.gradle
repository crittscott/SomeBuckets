plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

rootProject.configureGameTests(project)
sourceSets.main.resources.srcDir 'src/generated/resources'

def commonResources = project(':common').tasks.named('processResources', ProcessResources)

loom {
    forge {
        mixinConfig 'somebuckets.common.mixins.json'
    }
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        somebuckets_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        configureEach {
            property 'eventbus.api.strictRuntimeChecks', 'true'
        }

        data {
            data()
            environment 'data'
            forgeTemplate 'data'
            name 'Data'
            source sourceSets.main
            programArgs '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', commonResources.get().destinationDir.absolutePath
        }

        gameTestServer {
            server()
            environment 'gametestserver'
            forgeTemplate 'gameTestServer'
            name 'Game Test Server'
            property 'forge.enabledGameTestNamespaces', mod_id
            source sourceSets.gametest
        }
    }
}


// Loom emits all Forge userdev templates into one DLI config. The unused dataClient
// template produces a dataclient section that the bundled injector cannot parse.
afterEvaluate {
    def templates = loom.forgeRunsProvider.templates
    templates.findAll { it.name.equalsIgnoreCase('dataClient') }.each {
        templates.remove(it)
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    // Loom loads common with the platform's main mod. A separate runtime JAR would split packages.
    compileClasspath.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.minecraft_version-$rootProject.forge_version"
    annotationProcessor "net.minecraftforge:eventbus-validator:$rootProject.eventbus_validator_version"
    gametestAnnotationProcessor "net.minecraftforge:eventbus-validator:$rootProject.eventbus_validator_version"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

def commonAccessWidener = rootProject.file('common/src/main/resources/somebuckets.accesswidener')
def forgeAccessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
def commonAccessMirror = [
        'accessible field net/minecraft/world/entity/item/ItemEntity target Ljava/util/UUID;':
                'public net.minecraft.world.entity.item.ItemEntity target',
        'accessible method net/minecraft/core/cauldron/CauldronInteraction$Dispatcher put (Lnet/minecraft/world/item/Item;Lnet/minecraft/core/cauldron/CauldronInteraction;)V':
                'public net.minecraft.core.cauldron.CauldronInteraction$Dispatcher put(Lnet/minecraft/world/item/Item;Lnet/minecraft/core/cauldron/CauldronInteraction;)V',
        'accessible field net/minecraft/client/renderer/item/ItemModels ID_MAPPER Lnet/minecraft/util/ExtraCodecs$LateBoundIdMapper;':
                'public net.minecraft.client.renderer.item.ItemModels ID_MAPPER',
        'accessible field net/minecraft/client/color/item/ItemTintSources ID_MAPPER Lnet/minecraft/util/ExtraCodecs$LateBoundIdMapper;':
                'public net.minecraft.client.color.item.ItemTintSources ID_MAPPER',
]

tasks.register('verifyCommonAccessMirror') {
    inputs.files(commonAccessWidener, forgeAccessTransformer)

    doLast {
        def commonEntries = commonAccessWidener.readLines('UTF-8')
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') && !it.startsWith('accessWidener ') }
                .toSet()
        if (commonEntries != commonAccessMirror.keySet()) {
            throw new GradleException('Update verifyCommonAccessMirror for the changed common access widener')
        }

        def forgeEntries = forgeAccessTransformer.readLines('UTF-8')
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') }
                .toSet()
        def missing = commonAccessMirror.values().findAll { !forgeEntries.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Forge access transformer is missing common entries: $missing")
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyCommonAccessMirror')
}

// Forge also needs pack metadata at its own development resource root.
tasks.named('processResources', ProcessResources).configure {
    from project(':common').file('src/main/resources/pack.mcmeta')
    var replaceProperties = rootProject.sharedModProperties + [
            minecraft_version_range: rootProject.minecraft_version_range,
            forge_version_range: rootProject.forge_version_range,
            forge_loader_version_range: rootProject.forge_loader_version_range,
    ] + rootProject.packFormatProperties
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// Expands the GameTest manifest and data pack metadata.
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            mod_license               : mod_license,
            forge_version_range       : rootProject.forge_version_range,
            forge_loader_version_range: rootProject.forge_loader_version_range,
            minecraft_version_range   : rootProject.minecraft_version_range,
    ] + rootProject.packFormatProperties
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
    manifest.attributes 'MixinConfigs': 'somebuckets.common.mixins.json'
    filesMatching('pack.mcmeta') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

jar {
    archiveClassifier = 'dev'
}

tasks.named('assemble') {
    dependsOn shadowJar
}

// Loom loads common's class and resource directories as part of the main mod.
tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer', 'runData'] }.configureEach {
    dependsOn project(':common').tasks.named('classes')
}

rootProject.configureNativeDataGeneration(project)

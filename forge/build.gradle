plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    forge()
}

sourceSets {
    datagenLauncher
}

rootProject.configureGameTests(project)
sourceSets.main.resources.srcDir 'src/generated/resources'

loom {
    forge {
        mixinConfig 'somebuckets-common.mixins.json'
    }

    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
        somebuckets_gametest {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        data {
            data()
            name 'Data'
            source sourceSets.main
            programArgs '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', rootProject.file('common/src/main/resources').absolutePath
        }

        gameTestServer {
            server()
            environment 'gametestserver'
            forgeTemplate 'gameTestServer'
            name 'Game Test Server'
            property 'forge.enabledGameTestNamespaces', mod_id
            source sourceSets.gametest
        }
    }
}

// Architectury's runtime remapper leaves non-daemon workers alive after data generation returns.
// The isolated launcher exits only after the configured launch chain has completed.
tasks.named('runData', JavaExec).configure {
    dependsOn tasks.named('datagenLauncherClasses')
    classpath += sourceSets.datagenLauncher.output

    doFirst {
        systemProperty 'somebuckets.datagen.mainClass', mainClass.get()
        mainClass.set('com.github.crittscott.somebuckets.datagen.DataRunLauncher')
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_compile_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

// Expands ${...} placeholders in mods.toml (this module's own resource).
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = rootProject.sharedModProperties + [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

// Expands the GameTest mod's loader compatibility declarations from the production baseline.
tasks.named('processGametestResources', ProcessResources).configure {
    var replaceProperties = [
            mod_license: mod_license,
            forge_version_range: forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
            minecraft_version_range: minecraft_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
